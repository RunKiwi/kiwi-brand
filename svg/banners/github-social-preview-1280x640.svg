<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <radialGradient id="ogGlow" cx="20%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#93C645" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#060A0E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ogTerminalGlow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#93C645" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#060A0E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ogGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="#060A0E"/>
  <rect width="1280" height="640" fill="url(#ogGrid)"/>
  <rect width="1280" height="640" fill="url(#ogGlow)"/>
  <rect width="1280" height="640" fill="url(#ogTerminalGlow)"/>

  <!-- Left Column: Branding -->
  <g transform="translate(80, 110)">
    
    <!-- Logo Icon + Wordmark Row -->
    <g transform="translate(0, 0)">
      <!-- 8-Bit Chunky Chibi Scaled 6x (96x96) -->
      <g transform="translate(0, 0) scale(6)" shape-rendering="crispEdges">
        <rect x="5" y="2" width="5" height="1" fill="#88BC38"/>
        <rect x="3" y="3" width="8" height="1" fill="#93C645"/>
        <rect x="2" y="4" width="9" height="1" fill="#93C645"/>
        <rect x="2" y="5" width="9" height="1" fill="#93C645"/>
        <rect x="1" y="6" width="10" height="1" fill="#93C645"/>
        <rect x="1" y="7" width="10" height="1" fill="#93C645"/>
        <rect x="2" y="8" width="9" height="1" fill="#88BC38"/>
        <rect x="2" y="9" width="9" height="1" fill="#78A832"/>
        <rect x="3" y="10" width="7" height="1" fill="#6A962A"/>
        <rect x="4" y="11" width="5" height="1" fill="#5A8222"/>
        <rect x="7" y="4" width="2" height="2" fill="#111816"/>
        <rect x="7" y="4" width="1" height="1" fill="#FFFFFF"/>
        <rect x="11" y="5" width="3" height="2" fill="#FFAA28"/>
        <rect x="14" y="6" width="1" height="1" fill="#E89115"/>
        <rect x="4" y="12" width="2" height="2" fill="#FFAA28"/>
        <rect x="3" y="13" width="3" height="1" fill="#FFAA28"/>
        <rect x="8" y="12" width="2" height="2" fill="#FFAA28"/>
        <rect x="7" y="13" width="3" height="1" fill="#FFAA28"/>
      </g>

      <!-- Wordmark "kiwi" -->
      <text x="120" y="68" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">kiwi</text>
    </g>

    <!-- Headline -->
    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="-0.8">
      Coding agents inside
    </text>
    <text x="0" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#93C645" letter-spacing="-0.8">
      infrastructure you control.
    </text>

    <!-- Subtitle -->
    <text x="0" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#8E9893" letter-spacing="-0.2">
      Self-hosted sandboxes · 24h post-merge telemetry · Zero setup
    </text>

    <!-- Chips Row -->
    <g transform="translate(0, 340)">
      <rect width="130" height="34" rx="17" fill="rgba(147, 198, 69, 0.12)" stroke="#93C645" stroke-opacity="0.3"/>
      <text x="65" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#93C645" text-anchor="middle">BYOC + Cloud</text>

      <rect x="144" width="160" height="34" rx="17" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="224" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#E2E8F0" text-anchor="middle">2-Phase Sandbox</text>

      <rect x="318" width="170" height="34" rx="17" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="403" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#E2E8F0" text-anchor="middle">Telemetry Guard</text>
    </g>
  </g>

  <!-- Right Column: Diegetic Terminal Window -->
  <g transform="translate(680, 100)">
    
    <!-- Terminal Window Container -->
    <rect width="520" height="440" rx="18" fill="#0B131A" stroke="rgba(147, 198, 69, 0.25)" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <rect width="520" height="46" rx="18" fill="#0F1B24"/>
    <rect y="30" width="520" height="16" fill="#0F1B24"/>
    <line x1="0" y1="46" x2="520" y2="46" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="24" cy="23" r="6" fill="#E06A4E"/>
    <circle cx="44" cy="23" r="6" fill="#E8A13B"/>
    <circle cx="64" cy="23" r="6" fill="#4FB477"/>

    <!-- Window Title -->
    <text x="88" y="28" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8E9893">kiwi/job-42 · migrate-auth</text>
    
    <!-- Live Run Tag -->
    <rect x="420" y="14" width="80" height="20" rx="10" fill="rgba(147, 198, 69, 0.15)"/>
    <circle cx="432" cy="24" r="3" fill="#93C645"/>
    <text x="442" y="28" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#93C645">LIVE RUN</text>

    <!-- Terminal Code Lines -->
    <g transform="translate(24, 76)" font-family="'JetBrains Mono', monospace" font-size="13">
      <text x="0" y="0" fill="#93C645">$ kiwi submit &quot;Migrate auth to Postgres&quot;</text>
      
      <text x="0" y="36" fill="#FFAA28">[architect]</text>
      <text x="100" y="36" fill="#E2E8F0">round 1 · reading session store callers…</text>

      <rect x="0" y="56" width="310" height="26" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)"/>
      <text x="12" y="74" fill="#8E9893" font-size="11">🌿 branch kiwi/job-42 · round 1</text>

      <text x="0" y="118" fill="#4FB477">[implementer]</text>
      <text x="120" y="118" fill="#CBD5E1">editing pkg/session/store.go…</text>

      <text x="0" y="152" fill="#FFAA28">[architect]</text>
      <text x="100" y="152" fill="#CBD5E1">Missing rollback path — round 2 fixes it.</text>

      <text x="0" y="188" fill="#4FB477">[implementer]</text>
      <text x="120" y="188" fill="#CBD5E1">writing migration rollback sql…</text>

      <text x="0" y="224" fill="#93C645">✓</text>
      <text x="20" y="224" fill="#93C645">128 tests green · suite passed</text>

      <rect x="0" y="254" width="472" height="52" rx="10" fill="rgba(147, 198, 69, 0.08)" stroke="#93C645" stroke-opacity="0.3"/>
      <text x="18" y="286" fill="#93C645" font-weight="700" font-size="14">● Opened PR #42 → main</text>
      <text x="230" y="286" fill="#8E9893" font-size="12">2 rounds · 1 branch</text>
    </g>

    <!-- Perched Mascot on Window -->
    <g transform="translate(450, -22) scale(2)" shape-rendering="crispEdges">
      <rect x="5" y="2" width="5" height="1" fill="#88BC38"/>
      <rect x="3" y="3" width="8" height="1" fill="#93C645"/>
      <rect x="2" y="4" width="9" height="1" fill="#93C645"/>
      <rect x="2" y="5" width="9" height="1" fill="#93C645"/>
      <rect x="1" y="6" width="10" height="1" fill="#93C645"/>
      <rect x="1" y="7" width="10" height="1" fill="#93C645"/>
      <rect x="2" y="8" width="9" height="1" fill="#88BC38"/>
      <rect x="2" y="9" width="9" height="1" fill="#78A832"/>
      <rect x="3" y="10" width="7" height="1" fill="#6A962A"/>
      <rect x="11" y="5" width="3" height="2" fill="#FFAA28"/>
      <rect x="14" y="6" width="1" height="1" fill="#E89115"/>
      <rect x="4" y="12" width="2" height="2" fill="#FFAA28"/>
      <rect x="3" y="13" width="3" height="1" fill="#FFAA28"/>
      <rect x="8" y="12" width="2" height="2" fill="#FFAA28"/>
      <rect x="7" y="13" width="3" height="1" fill="#FFAA28"/>
      <!-- Headphones & Shades -->
      <rect x="4" y="1" width="5" height="1" fill="#FF4D6D"/>
      <rect x="3" y="2" width="1" height="3" fill="#FF4D6D"/>
      <rect x="9" y="2" width="1" height="3" fill="#FF4D6D"/>
      <rect x="2" y="4" width="1" height="3" fill="#00E5FF"/>
      <rect x="9" y="4" width="1" height="3" fill="#00E5FF"/>
      <rect x="6" y="4" width="4" height="2" fill="#090D0B"/>
      <rect x="6" y="4" width="1" height="1" fill="#00E5FF"/>
      <rect x="8" y="4" width="1" height="1" fill="#00E5FF"/>
    </g>
  </g>
</svg>
