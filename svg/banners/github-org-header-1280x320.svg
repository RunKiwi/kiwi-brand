<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>
    <radialGradient id="bannerGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#93C645" stop-opacity="0.16"/>
      <stop offset="80%" stop-color="#060A0E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="headerGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#93C645" fill-opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="320" fill="#060A0E"/>
  <rect width="1280" height="320" fill="url(#headerGrid)"/>
  <rect width="1280" height="320" fill="url(#bannerGlow)"/>

  <!-- Content Group (Center Aligned) -->
  <g transform="translate(640, 160)">
    
    <!-- Mascot + Wordmark Row -->
    <g transform="translate(-160, -65)">
      <!-- 8-Bit Chunky Chibi Scaled 6x (96x96) -->
      <g transform="translate(0, 0) scale(6)" shape-rendering="crispEdges">
        <rect x="5" y="2" width="5" height="1" fill="#88BC38"/>
        <rect x="3" y="3" width="8" height="1" fill="#93C645"/>
        <rect x="2" y="4" width="9" height="1" fill="#93C645"/>
        <rect x="2" y="5" width="9" height="1" fill="#93C645"/>
        <rect x="1" y="6" width="10" height="1" fill="#93C645"/>
        <rect x="1" y="7" width="10" height="1" fill="#93C645"/>
        <rect x="2" y="8" width="9" height="1" fill="#88BC38"/>
        <rect x="2" y="9" width="9" height="1" fill="#78A832"/>
        <rect x="3" y="10" width="7" height="1" fill="#6A962A"/>
        <rect x="4" y="11" width="5" height="1" fill="#5A8222"/>
        <rect x="7" y="4" width="2" height="2" fill="#111816"/>
        <rect x="7" y="4" width="1" height="1" fill="#FFFFFF"/>
        <rect x="11" y="5" width="3" height="2" fill="#FFAA28"/>
        <rect x="14" y="6" width="1" height="1" fill="#E89115"/>
        <rect x="4" y="12" width="2" height="2" fill="#FFAA28"/>
        <rect x="3" y="13" width="3" height="1" fill="#FFAA28"/>
        <rect x="8" y="12" width="2" height="2" fill="#FFAA28"/>
        <rect x="7" y="13" width="3" height="1" fill="#FFAA28"/>
      </g>

      <!-- Wordmark -->
      <text x="120" y="68" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="68" font-weight="800" fill="#FFFFFF" letter-spacing="-2">kiwi</text>
    </g>

    <!-- Tagline Text -->
    <text x="0" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#8E9893" text-anchor="middle" letter-spacing="-0.2">
      Coding agents that run inside infrastructure you control.
    </text>

    <!-- Sub Pills -->
    <text x="0" y="95" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#93C645" text-anchor="middle" letter-spacing="1">
      MANAGED &amp; BYOC · TWO-PHASE SANDBOX · 24H TELEMETRY GUARD
    </text>
  </g>

  <!-- Border Accent -->
  <line x1="0" y1="319" x2="1280" y2="319" stroke="#93C645" stroke-opacity="0.25" stroke-width="1"/>
</svg>
